name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:fsd
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build-storybook
      - run: pnpm exec playwright install --with-deps chromium
      # E2E가 만든 프로덕션 빌드로 크기와 Lighthouse 점수를 잽니다.
      - run: pnpm e2e
      - run: pnpm size
      - run: pnpm lhci
